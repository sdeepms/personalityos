name = "personalityos-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
LLM_PROVIDER = "openrouter"
ALLOWED_ORIGIN = "http://localhost:3000"
WORKER_URL = "http://localhost:8787"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "personalityos-storage"

# Secrets (set via `wrangler secret put` in production — stored in .dev.vars locally):
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY
# OPENROUTER_API_KEY
# ANTHROPIC_API_KEY
# MUAPI_API_KEY
# POSTHOG_API_KEY
# ALLOWED_ORIGIN (production: "https://personalityos.pages.dev,http://localhost:3000")
# WORKER_URL (production: "https://personalityos-api.your-subdomain.workers.dev")
